name: {{name.snakeCase()}}
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.2.3 <4.0.0"

dependencies:
  auto_route: ^11.2.0 
  dio: ^5.11.1
  equatable: ^3.0.0
  flutter:
    sdk: flutter
  flutter_pretty_dio_logger: ^3.0.0
  google_fonts: ^9.0.0
  shared_preferences: ^2.3.1

dev_dependencies:
